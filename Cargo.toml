[package]
name = "dvc-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "dvc_rs"
path = "src/lib.rs"

[[bin]]
name = "dvc-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
camino = "1"
clap = { version = "4", features = ["derive"] }
configparser = { version = "3.3", features = ["indexmap"] }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
